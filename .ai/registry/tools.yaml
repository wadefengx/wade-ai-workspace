tools:
  copilot-cli:
    path: runtime/tool-policy.md
    type: agent-runtime
    description: Primary execution entry point; reads and writes the repository and invokes tools
  npm:
    type: package-manager
    description: Installs dependencies and runs lint/typecheck/test
  mongosh:
    type: database-shell
    description: MongoDB data inspection and manual verification
  ollama:
    type: local-model-runtime
    description: Local model service and inference entry point
  hermes:
    type: model-provider
    description: OpenAI-compatible evaluation or inference target
